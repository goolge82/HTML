<html>
    <head>
        <title>Sign up</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>


    <body>
        <main>
            <h1>Sign Up</h1>
        </main>

        <form  name="Sign up" action="./charan.html">
            <div>
                <input type="text" name="Firstname" placeholder="First name" required></input><br><br>
                <input type="text" name="Lastname" placeholder="Last name" required></input><br><br>
                <input type="text" name="username" placeholder="username" required></input><br><br>
                <input type="date" name="date of birth" placeholder="date of birth" required></input><br><br> 

                <input type="radio" name="gender" value="male" required> Male</input>
                <input type="radio" name="gender" value="female" required> Female</input>
                <input type="email" name="Email" placeholder="Email" required></input><br><br>
                <input type="phone" name="phone number" placeholder="phone number" required></input><br><br>
                <input type="password" name="password" placeholder="password" required></input><br><br> 
                <input type="password" name="confirm password" placeholder="confirm password" required></input><br><br>
                <input type="file" name="Resume" placeholder="Resume" required></input><br><br>
                <input type="submit"  name="Sign Up" value="Sign Up"></input>

            </div>
        </form>
    </body>
</html>
